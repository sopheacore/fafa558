<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Box Gradients -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="boxLidFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    
    <!-- Ribbon Gradients -->
    <linearGradient id="ribbonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="40%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="ribbonHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="bowDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="giftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#B45309" flood-opacity="0.25"/>
    </filter>
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#giftShadow)">
    <!-- Ambient Shadow Under Box -->
    <ellipse cx="60" cy="108" rx="36" ry="7" fill="#0F172A" opacity="0.12"/>
    <ellipse cx="60" cy="108" rx="24" ry="4.5" fill="#B45309" opacity="0.2"/>

    <!-- Main Box Body Base -->
    <rect x="25" y="46" width="70" height="56" rx="10" fill="url(#boxFront)"/>
    
    <!-- Box Front Gloss/Specular Highlight -->
    <path d="M 25 56 Q 60 48 95 56 L 95 46 Q 60 46 25 46 Z" fill="#FFFBEB" opacity="0.4"/>
    <rect x="27" y="48" width="66" height="52" rx="8" fill="none" stroke="#FEF08A" stroke-width="1.5" opacity="0.6"/>

    <!-- Vertical Ribbon on Body -->
    <rect x="52" y="46" width="16" height="56" fill="url(#ribbonRed)"/>
    <rect x="54.5" y="46" width="3" height="56" fill="#FECDD3" opacity="0.6"/>
    <rect x="62.5" y="46" width="3" height="56" fill="#881337" opacity="0.4"/>

    <!-- Box Lid -->
    <rect x="20" y="36" width="80" height="18" rx="6" fill="url(#boxLidFront)"/>
    <rect x="21" y="37" width="78" height="5" rx="3" fill="#FFFBEB" opacity="0.5"/>
    <rect x="20.5" y="36.5" width="79" height="17" rx="5.5" fill="none" stroke="#FEF08A" stroke-width="1.2" opacity="0.7"/>

    <!-- Vertical Ribbon on Lid -->
    <rect x="52" y="36" width="16" height="18" fill="url(#ribbonRed)"/>
    <rect x="54.5" y="36" width="3" height="18" fill="#FECDD3" opacity="0.6"/>
    <rect x="62.5" y="36" width="3" height="18" fill="#881337" opacity="0.4"/>

    <!-- Ribbon Shadow under Lid -->
    <rect x="25" y="52" width="70" height="4" fill="#78350F" opacity="0.25"/>

    <!-- Luxury Ribbon Bow Left Loop -->
    <path d="M 60 36 C 44 14, 20 18, 32 34 C 40 42, 54 38, 60 36 Z" fill="url(#ribbonRed)"/>
    <path d="M 58 35 C 45 18, 26 22, 34 33 C 40 38, 52 36, 58 35 Z" fill="url(#ribbonHighlight)" opacity="0.7"/>
    <path d="M 36 29 C 32 23, 44 20, 52 30" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Luxury Ribbon Bow Right Loop -->
    <path d="M 60 36 C 76 14, 100 18, 88 34 C 80 42, 66 38, 60 36 Z" fill="url(#ribbonRed)"/>
    <path d="M 62 35 C 75 18, 94 22, 86 33 C 80 38, 68 36, 62 35 Z" fill="url(#ribbonHighlight)" opacity="0.7"/>
    <path d="M 84 29 C 88 23, 76 20, 68 30" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Ribbon Hanging Tails -->
    <path d="M 55 36 C 50 45, 38 52, 32 55 C 38 50, 48 44, 53 36 Z" fill="url(#bowDark)"/>
    <path d="M 65 36 C 70 45, 82 52, 88 55 C 82 50, 72 44, 67 36 Z" fill="url(#bowDark)"/>

    <!-- Bow Center Knot -->
    <ellipse cx="60" cy="35" rx="8" ry="7" fill="url(#ribbonRed)"/>
    <ellipse cx="60" cy="34" rx="6.5" ry="5.5" fill="url(#ribbonHighlight)"/>
    <ellipse cx="58.5" cy="32.5" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Sparkling Golden Stars -->
  <g filter="url(#sparkleGlow)">
    <!-- Sparkle Top Left -->
    <path d="M 22 22 Q 22 27 17 27 Q 22 27 22 32 Q 22 27 27 27 Q 22 27 22 22 Z" fill="#FDE047"/>
    <circle cx="22" cy="27" r="1.5" fill="#FFFFFF"/>

    <!-- Sparkle Top Right -->
    <path d="M 98 20 Q 98 26 92 26 Q 98 26 98 32 Q 98 26 104 26 Q 98 26 98 20 Z" fill="#FDE047"/>
    <circle cx="98" cy="26" r="1.8" fill="#FFFFFF"/>

    <!-- Small Sparkle Bottom Left -->
    <circle cx="15" cy="58" r="2" fill="#FBBF24"/>
    <circle cx="15" cy="58" r="1" fill="#FFFFFF"/>

    <!-- Small Sparkle Right -->
    <path d="M 104 68 Q 104 72 100 72 Q 104 72 104 76 Q 104 72 108 72 Q 104 72 104 68 Z" fill="#FDE047"/>
    <circle cx="104" cy="72" r="1.2" fill="#FFFFFF"/>
    
    <circle cx="98" cy="92" r="2.5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="98" cy="92" r="1.2" fill="#FFF"/>
  </g>
</svg>
